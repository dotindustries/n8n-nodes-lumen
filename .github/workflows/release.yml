name: Release

on:
  release:
    types:
      - published

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p 'require("./package.json").version')
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true'

  scan:
    name: Scan published package
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run n8n community package scanner
        run: |
          name=n8n-nodes-lumen
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5 6; do
            if npx -y @n8n/scan-community-package "$name@$version"; then
              exit 0
            fi
            echo "Scan attempt $attempt failed, waiting for npm propagation"
            sleep 30
          done
          exit 1
