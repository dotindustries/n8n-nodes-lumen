name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check for runtime dependencies
        run: |
          deps=$(node -e 'const p=require("./package.json");console.log(Object.keys(p.dependencies||{}).join(" "))')
          if [ -n "$deps" ]; then
            echo "Runtime dependencies are not allowed for verified community nodes: $deps"
            exit 1
          fi

      - name: Pack
        run: npm pack --dry-run
